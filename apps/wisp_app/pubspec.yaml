name: wisp
description: "The Open, Fast & Unified music player."
publish_to: 'none'

resolution: workspace

version: 26.10.1+322

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Logging
  logger: ^2.6.2

  # UI
  cupertino_ui: any
  cupertino_icons: ^1.0.8
  liquid_glass_easy: any
  material_symbols_icons: ^4.2960.0
  material_ui: any
  material_3_expressive: any
  simple_icons: ^16.23.0

  # Media Playback
  video_player: ^2.13.0
  video_player_win: ^3.2.2
  fvp: ^0.38.1
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  wisp_playback_engine: any
  wisp_audio_output_info: any
  audio_session: ^0.2.0
  audio_service: ^0.18.18
  audio_service_mpris: ^0.2.0
  audio_service_win: ^0.0.3
  image: ^4.0.0
  cached_network_image: ^3.4.1
  flutter_svg: 2.3.0
  flutter_cache_manager: ^3.4.1
  palette_generator: ^0.3.3

  # Networking
  http: ^1.2.0
  connectivity_plus: ^7.0.0
  shelf: ^1.4.1
  dio: ^5.7.0
  flutter_local_notifications: ^22.0.0
  flutter_foreground_task: ^11.0.1

  # Permissions
  flutter_multicast_lock: ^1.2.1
  permission_handler: ^13.0.1

  # App State Management
  provider: ^6.1.1
  window_manager: ^0.5.2

  # Security and Encryption
  flutter_secure_storage: ^11.0.0
  crypto: ^3.0.3
  pointycastle: ^4.0.0

  # YouTube Engine Integration
  youtube_explode_dart:
    git:
      url: https://github.com/Hexer10/youtube_explode_dart.git
      ref: master
  wisp_newpipe_manager: any
  wisp_ytdlp_manager: any
  newpipeextractor_dart: ^2.0.1

  # Storage and persistence
  path_provider: ^2.1.4
  shared_preferences: 2.5.5

  # URL handling and deep linking
  url_launcher: ^6.3.2
  app_links: ^7.2.1

  # Device & System information
  path: ^1.9.0
  file_picker: ^12.1.3
  win32_registry: ^3.0.0
  device_info_plus: ^13.2.0

  # Modular Provider Utilities
  flutter_js: ^0.8.7
  flutter_inappwebview: ^6.2.0-beta.3
  xml: ^6.0.0

  # Other local packages
  wisp_shared: any
  wisp_assets: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
